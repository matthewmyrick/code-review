[package]
name = "appa"
description = "Appa — local-first code review that works with your agents"
authors = ["Matthew Myrick"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows.
name = "appa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
appa-core.workspace = true
appa-github.workspace = true
appa-cache.workspace = true
appa-agents.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
