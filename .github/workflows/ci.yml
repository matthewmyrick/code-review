# Strict CI — this is the deploy gate. Every job must pass; there are no
# optional checks. See CONTRIBUTING.md for what each gate enforces.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  standards:
    name: standards (file length, formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 400-line rule
        run: ./scripts/check-file-length.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prettier check
        run: pnpm format:check

  frontend:
    name: frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eslint (zero warnings)
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: production build
        run: pnpm build

  rust:
    name: rust (fmt, clippy -D warnings, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (zero warnings; unwrap/expect/panic denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # Everything green = safe to deploy. Branch protection should require
  # exactly this job.
  gate:
    name: deploy gate
    needs: [standards, frontend, rust]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all gates green — safe to deploy"
